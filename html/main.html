<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MewAI - Dashboard</title>
    <link rel="stylesheet" href="../css/main.css">
</head>

<body>

    <header>
        <button class="icon-btn" id="menuToggleBtn">
            <img src="../icons/menu.png" alt="Open Menu">
        </button>

        <a href="ghost.html" class="icon-btn">
            <img src="../icons/ghost.png" alt="Ghost Mode">
        </a>
    </header>

    <div class="overlay" id="screenOverlay"></div>

    <aside id="leftSidebar" class="sidebar">
        <div class="sidebar-header">MewAI - Dashboard</div>

        <!-- Заголовок списка чатов -->
        <div class="chats-header">Saved Conversations</div>

        <!-- Список чатов (занимает всё свободное место) -->
        <div id="chatsListWrapper" class="chats-container">
            Loading conversation history...
        </div>

        <nav class="sidebar-footer-nav">
            <a href="profile.html" class="icon-nav-btn" title="Profile">
                <img src="../icons/profile.png" alt="Profile">
            </a>
            <a href="stats.html" class="icon-nav-btn" title="Statistics">
                <img src="../icons/statistic.png" alt="Statistics">
            </a>
            <a href="donate.html" class="icon-nav-btn" title="Support">
                <img src="../icons/support.png" alt="Support">
            </a>
            <button id="logoutBtn" class="icon-nav-btn logout" title="Logout">
                <img src="../icons/logout.png" alt="Logout">
            </button>
        </nav>
    </aside>

    <iframe src="chats.html" class="main-content-frame" id="chatIframe"></iframe>

    <script src="../js/main.js"></script>
</body>

</html>

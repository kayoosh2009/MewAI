<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MewAI - Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="/css/chats.css">
</head>
<body>

    <div class="chat-container" id="chatContainer">
        <div class="welcome-screen" id="welcomeScreen">
            <div class="welcome-time" id="userTime">00:00 AM</div>
            <div class="welcome-title">New Conversation</div>
        </div>
    </div>

    <div class="input-area-wrapper">
        <div class="left-controls">
            <!-- Красивый переключатель режимов -->
            <div class="mode-toggle-container">
                <button id="modeFast" class="mode-btn active">Fast</button>
                <button id="modeThinking" class="mode-btn">Thinking</button>
            </div>
        </div>
        
        <textarea id="promptInput" class="input-box" placeholder="Напиши сообщение..." rows="1"></textarea>
        
        <button id="sendBtn" class="btn-send">
            <img src="../icons/send.png" alt="Send" class="icon-img">
        </button>
        
        <!-- Скрытый инпут оставлен на случай, если вдруг понадобится, но он больше не виден и не кликабелен -->
        <input type="file" id="fileInput" hidden>
    </div>

    <div class="ad-container-fixed">
        <div id="frame" style="width: 320px;margin: auto;z-index: 99998;height: auto">
            <iframe data-aa='2438199' src='//ad.a-ads.com/2438199/?size=320x100&background_color=211D2D&title_color=F2DFD8&title_hover_color=F2DFD8&text_color=F2DFD8&link_color=F2DFD8&link_hover_color=F2DFD8'
                    style='border:0; padding:0; width:320px; height:100px; overflow:hidden;display: block;margin: auto'></iframe>
        </div>
        </div>

    <script src="../js/chats.js"></script>
</body>
</html>
